name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, and build
    runs-on: ubuntu-latest
    env:
      WIFI_SSID: ci-network
      WIFI_PASSWORD: ci-network-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust components
        uses: dtolnay/rust-toolchain@stable
        with:
          target: riscv32imac-unknown-none-elf
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --target riscv32imac-unknown-none-elf -- -D warnings

      - name: Build firmware
        run: cargo build --locked --release --target riscv32imac-unknown-none-elf
