[package]
name = "esp32-c6-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "esp32-c6-playground"
path = "src/bin/main.rs"

[dependencies]
embassy-executor = "0.9.1"
embassy-time = "0.5.0"
esp-backtrace = { version = "0.18.1", features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6"] }
esp-hal = { version = "~1.0", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.16.1", default-features = false, features = ["esp32c6", "uart"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
large_stack_frames = "warn"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
